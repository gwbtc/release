name: Release
# gwbtc/release: every input of a Groundwire release is pinned here by commit,
# in the env block below. A release is a change to one or more of those pins,
# merged to main: this workflow builds, validates (boots the pill) and
# publishes a prerelease in THIS repo. `./bump <KEY> [<ref>]` moves a pin.
#
# Pull requests build the PR's pins and publish nothing. A dispatch with
# publish=false is a test build from main's pins (or from the refs you give).
on:
  push:
    branches:
      - main
    # Documentation and tooling commits are not releases.
    paths-ignore:
      - 'README.md'
      - 'bump'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'bump'
  workflow_dispatch:
    inputs:
      urbit_ref:
        description: 'gwbtc/urbit ref (default: the pin)'
        required: false
        default: ''
      groundwire_ref:
        description: 'gwbtc/groundwire ref (default: the pin)'
        required: false
        default: ''
      vere_ref:
        description: 'gwbtc/vere ref (default: the pin)'
        required: false
        default: ''
      tag_prefix:
        description: 'release tag prefix (default: groundwire-alpha)'
        required: false
        default: ''
      publish:
        description: 'publish a GitHub release from this build (false: build, validate and upload the run artifacts only)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  URBIT_BRANCH: 2a4ab46a74593aa80566ef95f56a67597a1f363a
  VERE_BRANCH: 828244e7751ffc2c7a91c34907c49a9d51f2cc8f
  URCRYPT_BRANCH: 88c4cf7fd613789207e8e47a8233799cbe8ffe19
  COMET_MINER_BRANCH: f61b430c025328900bc699d2ed16069a26ada424
  # gwbtc/urbit-dns: the %dns desk, the client of the sponsor's naming
  # service (a groundwire.me name + an %acme certificate per comet). In the
  # pill so boot.sh can run its dns-address thread on every comet with no
  # install step. Public repo, pinned by full SHA like the two above
  # (`git ls-remote https://github.com/gwbtc/urbit-dns main`). The desk is
  # assembled by the repo's own `zig build`, which vendors the base-dev,
  # dns and mnemonyms imports it pins; its kelvin is 408.
  # 3248b57 (2026-09-19, PR #1): the thread no longer fetches itself
  # through iris (that hung forever on any ship running Landscape).
  URBIT_DNS_REF: 3248b57b70529ed8993d4df2827427819e4fa67e
  # gwbtc/node is public too. Its code lives on `develop`; `main` holds only
  # a README, so this is pinned to a full SHA rather than a branch name, same
  # so a given release is reproducible. To bump:
  # read the diff on develop, then paste the new 40-char SHA here
  # (`git ls-remote https://github.com/gwbtc/node develop`).
  # Pinned to 063720b9 (2026-08-12): %reorg-rollback now carries
  # `last-common` + `stale-branch`, the list of orphaned blocks, which is
  # what %gw-btc's reorg repair filters its points against.
  #
  # This pin and the %groundwire desk must move TOGETHER, and the coupling
  # is at RUNTIME, not at build time: the two desks compile independently
  # (%gw-btc reads /sur/light-client from its OWN desk), so nothing here
  # fails if they disagree. What fails is the first reorg on a live ship.
  # %gw-btc unpacks the fact with `!<`, the old flat [block-height
  # block-hash] does not nest under the new mold or vice versa, and the
  # `?>` bails in +on-agent. Below this SHA, a %groundwire carrying the
  # reorg repair is broken on reorgs; at or above it, a %groundwire
  # without the repair is broken on reorgs. Check GROUNDWIRE_BRANCH has
  # the matching desk before bumping.
  #
  # 39648ac3 (2026-10-02, gwbtc/node develop): Robin's light client.  Its
  # state migrates from fa10f581's (the hd/lc-peers build every earlier RC
  # shipped), it gives every fact as one %bitcoin-client-update mark and
  # takes pokes as %bitcoin-client-action -- %gw-btc reads that form from
  # groundwire daad90c on, and gwlib.sh's peer seeding sends it -- and it
  # still accepts the old %bitcoin-client-connect-peer poke, so a comet on
  # an older release's gwlib.sh can still seed peers.
  NODE_REF: 8a062161e83a2e919ff74f4cbf3368f69e3a413d
  # desks
  GROUNDWIRE_BRANCH: 788db95d74a206064feff86b57b442caf3c6a54e
  URBIT_MCP_BRANCH: 029079b33a12fa2f6004d74ad0a92fff86af0cfb
  VITRIOL_BRANCH: 9862ec2d2b192629452c791adb3d870000125100
  TRILL_BRANCH: 0886978c3d300ee4b4adeaf617685d74da7134e8
  LANDSCAPE_BRANCH: 5193635c45a346b3030280e76ee32d6fa290bc98
  DRIVE_BRANCH: f9ee299ba88e0a89cde7f3418cba2736b9f6edd7
  # grubbery develop at 2944cce is what groundwire-alpha-2026.10.29_2 shipped;
  # its 18 later commits (to 2026-11-03) crash the pill's validate boot out of
  # memory during %grubbery's install. Bump when develop boots again.
  GRUBBERY_BRANCH: 2944cce0214be6a0e9a1becd1a8b86ecd72591de
  JARS_BRANCH: e8c533cdb933f8558835aabac64dc01c794c61f0
  TRUNK_BRANCH: 7bda1e27e90edca2dccbde4869db5c49e936746f
  # tloncorp/tlon-apps: the %groups desk, pinned by full SHA because master
  # moves with every Tlon release (`git ls-remote https://github.com/tloncorp/tlon-apps master`).
  # Its desk deps are vendored by peru per the repo's peru.yaml, which pins
  # the same landscape commit as LANDSCAPE_BRANCH above.
  # 77f107f (2026-10-02): master, Merge pull request #6704.
  GROUPS_REF: 77f107fdfe810f1bc1e67bbef9dfc9efe8a5f6b3
  # urbit/webterm: the %webterm desk, pinned by full SHA.
  # 28f13f5 (2026-05-02): mobile-input-fix, "ui: fix mobile input and
  # viewport, improve scroll & selection".  That commit changes ui/ only;
  # its desk.docket-0 still names the v1.1.1 glob.
  WEBTERM_REF: 28f13f588f90b3e40babe10493bbf71d696e03e0
  # The distribution ship every baked desk's desk.ship points at: a
  # booted ship opens a Clay OTA sync to it per desk (get-publisher in
  # sur/hood.hoon; the sync is a second channel, not a gate).  This is
  # our OWN sponsor, which we install all of these desks onto, so it
  # can actually serve every one of them -- unlike production's dister,
  # which did not publish node/trill.
  DESK_DISTER: ~barmul-bolmet-ronlus-lighul--rovtun-satryc-moclug-daplyd
  # The PKI gateway a comet's first boot fetches the galaxy table and
  # network domains from (gw-vere --gateway; dawn.c =lamp= / =turf=).  gw-vere's
  # built-in default is http://143.198.70.9:8080, a droplet that is gone
  # (2026-09-16: unreachable; the comet-boot validation retried for
  # twelve minutes and failed).  Any ship's eyre serves the same scries;
  # this is the sponsor's, on the port its runtime currently listens on.
  # The durable fix is gwbtc/vere#23 (no gateway at boot).
  GW_GATEWAY: http://146.190.199.0:80
  # gwbtc/chorus: the %chorus desk, pinned by full SHA so a release is
  # reproducible (`git ls-remote https://github.com/gwbtc/chorus main`).
  # the desk is assembled by the repo's own `zig build`, which vendors the
  # mcp, urbit-markdown, mnemonyms, kademlia and base-dev imports it pins;
  # its kelvin is 408. fbe7e0a (2026-10-05): update kademlia import.
  CHORUS_REF: 6d43fd9e4c8cf3aec99f1f5d3809cf6be50f8a32

jobs:
  # =============================================================
  # Build the bleeding-edge brass pill on a fake ~zod
  #
  # Channel:
  #   - This workflow is the developer/bleeding-edge release lane.
  #   - The slower onboarding lane is in daily-release.yml and publishes
  #     groundwire-daily-* tags.
  #
  # Flow:
  #   1. Boot fake ~zod with custom vere + kelvin 408 arvo (-A flag)
  #   2. For each desk: create from %base, mount, clear, populate, commit
  #   3. Re-write the light-client desks' desk.bill/kelvin to Clay via %info
  #      and verify them (filesystem commits are unreliable)
  #   4. Build brass pill via fyrd, wait for it to appear on filesystem
  #
  # Key gotchas:
  #   - desk-create.sh copies ALL of %base (including desk.bill with
  #     %acme etc). Must clear and replace before pill build.
  #   - Filesystem commits need mark files (mar/bill.hoon etc) to work.
  #     desk-populate.sh preserves mar/ when clearing.
  #   - Even with marks, filesystem commits can be unreliable. The %info
  #     step writes desk.bill directly to Clay as a safety net.
  # =============================================================
  build-pill:
    name: Build pill
    needs: build-vere
    runs-on: ubuntu-22.04
    env:
      CONN_SOCK: ./zod/.urb/conn.sock
    steps:
      - name: Clean up leftover piers
        run: sudo rm -rf ./zod || true

      # the workflow's helper scripts (automation/) live in gwbtc/urbit, which
      # used to be the repo this ran in; check it out at the kernel pin
      - name: Checkout gwbtc/urbit (automation scripts)
        uses: actions/checkout@v4
        with:
          repository: gwbtc/urbit
          ref: ${{ inputs.urbit_ref || env.URBIT_BRANCH }}

      - name: Download custom vere (kelvin 408 compatible)
        uses: actions/download-artifact@v4
        with:
          name: gw-vere-linux-x86_64
          path: ./vere-bin

      - name: Install custom vere
        run: |
          chmod +x ./vere-bin/gw-vere
          sudo mv ./vere-bin/gw-vere /usr/local/bin/urbit
          urbit --version || true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat-openbsd

      # A guard nobody has watched fire is not a guard.  desk-commit.sh now
      # refuses a desk containing a file extension the desk has no
      # /mar/<ext>/hoon for, because Clay's answer to one of those is to take
      # the commit, change nothing, print nothing and leave the desk at its
      # old revision -- measured on a live ship, a desk with one .md in it
      # went nowhere while the same desk without it went 2 -> 3.  That is how
      # a %groundwire desk with no %gw-btc in it nearly shipped
      # (gwbtc/groundwire 336e6e3), and main has no doc/ directory, which is
      # the only reason nobody hit it sooner.
      #
      # This runs the check against a desk built to fail it and the same desk
      # with the offending file removed, so every build watches the guard
      # fire before any real desk is trusted to it.  It costs a second.
      - name: Self-test the desk mark guard
        run: ./automation/desk-check-marks.sh --self-test

      # -- Checkout all desk source repos --
      - name: Checkout gwbtc/urbit
        uses: actions/checkout@v4
        with:
          repository: gwbtc/urbit
          ref: ${{ inputs.urbit_ref || env.URBIT_BRANCH }}
          path: gwbtc-urbit
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Checkout gwbtc/groundwire
        uses: actions/checkout@v4
        with:
          repository: gwbtc/groundwire
          ref: ${{ inputs.groundwire_ref || env.GROUNDWIRE_BRANCH }}
          path: gwbtc-groundwire
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Checkout gwbtc/urbit-mcp
        uses: actions/checkout@v4
        with:
          repository: gwbtc/urbit-mcp
          ref: ${{ env.URBIT_MCP_BRANCH }}
          path: gwbtc-urbit-mcp
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Checkout Vitriol
        uses: actions/checkout@v4
        with:
          repository: gwbtc/vitriol
          ref: ${{ env.VITRIOL_BRANCH }}
          path: gwbtc-vitriol
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Checkout gwbtc/trill
        uses: actions/checkout@v4
        with:
          repository: gwbtc/trill
          ref: ${{ env.TRILL_BRANCH }}
          path: gwbtc-trill

      - name: Checkout gwbtc/grubbery
        uses: actions/checkout@v4
        with:
          repository: gwbtc/grubbery
          ref: ${{ env.GRUBBERY_BRANCH }}
          path: gwbtc-grubbery

      - name: Checkout mopfel-winrux/jars
        uses: actions/checkout@v4
        with:
          repository: mopfel-winrux/jars
          ref: ${{ env.JARS_BRANCH }}
          path: jars

      - name: Checkout gwbtc/trunk
        uses: actions/checkout@v4
        with:
          repository: gwbtc/trunk
          ref: ${{ env.TRUNK_BRANCH }}
          path: gwbtc-trunk

      - name: Checkout tloncorp/tlon-apps
        uses: actions/checkout@v4
        with:
          repository: tloncorp/tlon-apps
          ref: ${{ env.GROUPS_REF }}
          path: tlon-apps

      - name: Checkout urbit/webterm
        uses: actions/checkout@v4
        with:
          repository: urbit/webterm
          ref: ${{ env.WEBTERM_REF }}
          path: urbit-webterm

      - name: Checkout tloncorp/landscape
        uses: actions/checkout@v4
        with:
          repository: tloncorp/landscape
          ref: ${{ env.LANDSCAPE_BRANCH }}
          path: gwbtc-landscape
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Checkout gwbtc/drive
        uses: actions/checkout@v4
        with:
          repository: gwbtc/drive
          ref: ${{ env.DRIVE_BRANCH }}
          path: gwbtc-drive
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Checkout gwbtc/node
        uses: actions/checkout@v4
        with:
          repository: gwbtc/node
          ref: ${{ env.NODE_REF }}
          path: gwbtc-node

      - name: Checkout gwbtc/urbit-dns (desk)
        uses: actions/checkout@v4
        with:
          repository: gwbtc/urbit-dns
          ref: ${{ env.URBIT_DNS_REF }}
          path: gwbtc-urbit-dns
      - name: Checkout gwbtc/chorus
        uses: actions/checkout@v4
        with:
          repository: gwbtc/chorus
          ref: ${{ env.CHORUS_REF }}
          path: gwbtc-chorus
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      # -- Boot fake ~zod --

      - name: Download pill builder pill
        run: |
          curl -fL -o ./gw-pill-builder.pill \
            https://groundwire.nyc3.cdn.digitaloceanspaces.com/CI/ur-408k-rc1-pill-builder.pill

      - name: Boot fake ~zod with kelvin 408 arvo
        run: |
          urbit -d -F zod -B ./gw-pill-builder.pill -c zod

      - name: Wait for ~zod to be idle
        run: ./automation/wait-idle.sh "$CONN_SOCK"

      - name: Verify kelvin 408 boot
        run: |
          source ./automation/fyrd.sh
          read -r -d '' SCRY_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)
              ^-  form:m
              ;<  our=@p   bind:m  get-our
              ;<  now=@da  bind:m  get-time
              =/  kel  .^(* %cx /(scot %p our)/base/(scot %da now)/sys/kelvin)
              (pure:m !>(;;(@t (crip (noah !>(kel))))))
              '''
          ==
          HOON
          RESULT=$(send_fyrd "$SCRY_FYRD")
          echo "Clay kelvin: $RESULT"

      - name: Mount %base desk
        run: ./automation/desk-mount.sh base ./zod "$CONN_SOCK"

      # -- Populate desks --
      # Each desk: create from %base → mount → clear (preserving marks)
      # → copy desk-specific content → ensure kelvin/bill → commit

      - name: Populate %gw-base desk
        run: |
          ./automation/desk-create.sh gw-base "$CONN_SOCK"
          ./automation/desk-mount.sh gw-base ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh gw-base ./zod
          cp -rL gwbtc-urbit/pkg/arvo/* ./zod/gw-base/
          ./automation/desk-commit.sh gw-base ./zod "$CONN_SOCK"

      # TRANSITIONAL, DELETE WITH THE MAKEFILE SHIM.
      #
      # This workflow runs against TWO different groundwire refs: the dispatch
      # input, and -- on a pull_request, which is how #67's own CI runs -- the
      # env default, `main`.  `main` has not been renamed yet and has no
      # `gw-btc` target, so pinning the new name here turns #67's CI red until
      # gwbtc/groundwire#129 merges.  Measured, not guessed: run 31827413435
      # failed at exactly this step.
      #
      # The groundwire Makefile covers the mirror image (an OLD workflow
      # against a NEW desk) by answering to both names.  This covers the other
      # direction.  Between them there is no red window in either order.
      #
      # The desk name follows the dist we actually found, rather than being
      # forced: a pre-rename tree carries %urb-watcher, and installing that
      # under a %gw-btc name would be a lie told by the build.
      - name: Build the gw-btc desk (tolerating a pre-rename ref)
        run: |
          cd gwbtc-groundwire
          if make -n gw-btc >/dev/null 2>&1; then
            make gw-btc
            echo "GW_DESK=gw-btc"                >> "$GITHUB_ENV"
            echo "GW_DIST=gwbtc-groundwire/dist-gw-btc" >> "$GITHUB_ENV"
          else
            echo "note: this groundwire ref predates the %gw-btc rename"
            make groundwire
            echo "GW_DESK=groundwire"                       >> "$GITHUB_ENV"
            echo "GW_DIST=gwbtc-groundwire/dist-groundwire" >> "$GITHUB_ENV"
          fi

      - name: Populate the gw-btc desk
        run: |
          test -d "$GW_DIST" || { echo "::error::$GW_DIST missing after build"; exit 1; }
          echo "installing $GW_DIST as %$GW_DESK"
          ./automation/desk-create.sh "$GW_DESK" "$CONN_SOCK"
          ./automation/desk-mount.sh "$GW_DESK" ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh "$GW_DESK" ./zod
          cp -rL "$GW_DIST"/* "./zod/$GW_DESK/"
          # OTA source: sync %gw-btc from our sponsor (see DESK_DISTER).
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "./zod/$GW_DESK/mar"
          cp "gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "./zod/$GW_DESK/mar/ship.hoon"
          echo "$DESK_DISTER" > "./zod/$GW_DESK/desk.ship"
          ./automation/desk-commit.sh "$GW_DESK" ./zod "$CONN_SOCK"

      # -- The light client: %node --
      #
      # %node is the Bitcoin light client (agent %bitcoin-client). It reaches
      # Bitcoin through the kernel's %mach vane; the tcp-sidecar process and
      # its %tcp-sidecar desk are gone (2026-11-03). Baking it into the pill is
      # what lets a freshly booted ship sync with no post-boot desk installs.

      - name: Populate %node desk
        run: |
          ./automation/desk-create.sh node "$CONN_SOCK"
          ./automation/desk-mount.sh node ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh node ./zod
          cp -rL gwbtc-node/desk/* ./zod/node/

          # The four in-CI patches this step used to apply (sys.kelvin 408,
          # [%block-filter ~], connect-peer mark cases, best-block mark
          # .last-common reads) are in the desk itself as of NODE_REF
          # (gwbtc/node develop). Guard against a NODE_REF that has
          # lost them rather than silently re-patching: fail the build.
          grep -q '%zuse 408' ./zod/node/sys.kelvin
          test "$(grep -c '\[%block-filter\])' ./zod/node/app/bitcoin-client.hoon || true)" = 0

          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "./zod/node/mar"
          cp "gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "./zod/node/mar/ship.hoon"
          echo "$DESK_DISTER" > ./zod/node/desk.ship
          ./automation/desk-commit.sh node ./zod "$CONN_SOCK"

      - name: Install zig (assembles the %dns desk)
        run: |
          # gwbtc/urbit-dns has no checked-in vendored deps; its build.zig
          # fetches the pinned base-dev/dns/mnemonyms imports and lays the
          # desk out under zig-out/. Same zig the laptop builds it with.
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - name: Populate %dns desk
        run: |
          # The naming service's client desk: the dns-address thread that
          # asks the sponsor for a groundwire.me name and installs the turf
          # (eyre then orders the certificate through %acme). In the pill so
          # boot.sh can run it on every comet without an install step. The
          # desk carries its own kelvin ([%zuse 408]) and one agent, %gw-dns,
          # which is inert on a comet (its on-init is the default).
          (cd gwbtc-urbit-dns && zig build)
          test -f gwbtc-urbit-dns/zig-out/ted/dns/address.hoon
          grep -q '%zuse 408' gwbtc-urbit-dns/zig-out/sys.kelvin
          # The self-check that hung the thread must stay gone (PR #1).
          test "$(grep -c 'self-check-http' gwbtc-urbit-dns/zig-out/ted/dns/address.hoon || true)" = 0
          ./automation/desk-create.sh dns "$CONN_SOCK"
          ./automation/desk-mount.sh dns ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh dns ./zod
          cp -rL gwbtc-urbit-dns/zig-out/* ./zod/dns/
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p ./zod/dns/mar
          cp gwbtc-urbit/pkg/base-dev/mar/ship.hoon ./zod/dns/mar/ship.hoon
          echo "$DESK_DISTER" > ./zod/dns/desk.ship
          ./automation/desk-commit.sh dns ./zod "$CONN_SOCK"

      # The filesystem commits above are the primary path and do land both
      # files -- but only as long as Clay's mount sync behaves, and the "Key
      # gotchas" note at the top of this job records that it does not always.
      # A dropped desk.bill is silent: the pill still boots, the desk is still
      # there, and the agent simply never starts. So write both files straight
      # to Clay via %info, then read them back and fail the build if either is
      # missing. %mut with identical content is a no-op, so this is safe when
      # the commit already worked.
      #
      # The agent lists are parsed out of each repo's own desk.bill rather
      # than hardcoded here, so adding an agent upstream cannot leave this
      # workflow silently pinning a stale list.
      - name: Write %node desk.bill and kelvin to Clay
        run: |
          source ./automation/fyrd.sh

          bill_from() {
            local duz
            duz=$(grep -o '%[a-z][a-z0-9-]*' "$1" | tr '\n' ' ' | sed 's/ *$//')
            if [ -z "$duz" ]; then
              echo "ERROR: parsed no agents out of $1" >&2
              return 1
            fi
            echo "~[${duz}]"
          }

          NODE_BILL=$(bill_from gwbtc-node/desk/desk.bill)
          echo "%node desk.bill: ${NODE_BILL}"

          # %node carries the widened weft.
          write_desk() {
            local desk="$1" bill="$2" kelvin="$3"
            read -r -d '' INFO_FYRD << HOON || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)
              ^-  form:m
              ;<  ~  bind:m
                %:  send-raw-card
                    %pass  /fix-desk
                    %arvo  %c
                    %info  %${desk}  %&
                    :~  [/desk/bill %mut %bill !>(\`(list dude:gall)\`${bill})]
                        [/sys/kelvin %mut %kelvin !>(\`waft:clay\`[[%1 ~] (sy ${kelvin})])]
                    ==
                ==
              (pure:m !>('written'))
              '''
          ==
          HOON
            echo "Writing %${desk} desk.bill and sys.kelvin to Clay..."
            send_fyrd "$INFO_FYRD" > /dev/null
          }

          write_desk node        "$NODE_BILL"    '~[[%zuse 409] [%zuse 408]]'
          sleep 5

      - name: Verify %node landed in Clay
        run: |
          source ./automation/fyrd.sh
          FAILED=0
          for desk in node; do
            read -r -d '' SCRY_FYRD << HOON || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  ==
              '''
              =/  m  (strand ,vase)
              ^-  form:m
              ;<  our=@p   bind:m  get-our
              ;<  now=@da  bind:m  get-time
              =/  bil  .^((list dude:gall) %cx /(scot %p our)/${desk}/(scot %da now)/desk/bill)
              =/  kel  .^(waft:clay %cx /(scot %p our)/${desk}/(scot %da now)/sys/kelvin)
              (pure:m !>((crip (noah !>([bil ~(tap in (waft-to-wefts:clay kel))])))))
              '''
          ==
          HOON
            RESULT=$(send_fyrd "$SCRY_FYRD" 2>/dev/null)
            echo "%${desk}: ${RESULT}"
            if ! echo "$RESULT" | grep -q 'num=408'; then
              echo "ERROR: %${desk} sys.kelvin does not accept 408"
              FAILED=1
            fi
            if ! echo "$RESULT" | grep -q '\[~\[%'; then
              echo "ERROR: %${desk} desk.bill is empty; its agents would never start"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1
          echo "%node is installable on this kernel."

      - name: Set up Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          cache-key: pill-desks

      - name: Populate %mcp desk
        run: |
          ROOT="${GITHUB_WORKSPACE:-$PWD}"
          "${ROOT}/automation/desk-create.sh" mcp "$CONN_SOCK"
          "${ROOT}/automation/desk-mount.sh" mcp "${ROOT}/zod" "$CONN_SOCK"
          "${ROOT}/automation/desk-populate.sh" mcp "${ROOT}/zod"
          pushd "${ROOT}/gwbtc-urbit-mcp"
          zig build
          cp -rL zig-out/* "${ROOT}/zod/mcp/"
          popd
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "${ROOT}/zod/mcp/mar"
          cp "${ROOT}/gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "${ROOT}/zod/mcp/mar/ship.hoon"
          echo "$DESK_DISTER" > "${ROOT}/zod/mcp/desk.ship"
          "${ROOT}/automation/desk-commit.sh" mcp "${ROOT}/zod" "$CONN_SOCK"

      - name: Populate %vitriol desk
        run: |
          ROOT="${GITHUB_WORKSPACE:-$PWD}"
          "${ROOT}/automation/desk-create.sh" vitriol "$CONN_SOCK"
          "${ROOT}/automation/desk-mount.sh" vitriol "${ROOT}/zod" "$CONN_SOCK"
          "${ROOT}/automation/desk-populate.sh" vitriol "${ROOT}/zod"
          pushd "${ROOT}/gwbtc-vitriol"
          zig build -Ddesk="${ROOT}/zod/vitriol/"
          popd
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "${ROOT}/zod/vitriol/mar"
          cp "${ROOT}/gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "${ROOT}/zod/vitriol/mar/ship.hoon"
          echo "$DESK_DISTER" > "${ROOT}/zod/vitriol/desk.ship"
          "${ROOT}/automation/desk-commit.sh" vitriol "${ROOT}/zod" "$CONN_SOCK"

      - name: Populate %trill desk
        run: |
          # gwbtc/trill keeps a self-contained desk in backend/, which its own
          # deploy workflow rsyncs to the dister as %trill.
          ./automation/desk-create.sh trill "$CONN_SOCK"
          ./automation/desk-mount.sh trill ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh trill ./zod
          cp -rL gwbtc-trill/backend/* ./zod/trill/
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "./zod/trill/mar"
          cp "gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "./zod/trill/mar/ship.hoon"
          echo "$DESK_DISTER" > ./zod/trill/desk.ship
          ./automation/desk-commit.sh trill ./zod "$CONN_SOCK"

      - name: Populate %grubbery desk
        run: |
          # self-contained; its sys.kelvin already lists [%zuse 408].
          ./automation/desk-create.sh grubbery "$CONN_SOCK"
          ./automation/desk-mount.sh grubbery ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh grubbery ./zod
          cp -rL gwbtc-grubbery/desk/* ./zod/grubbery/
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "./zod/grubbery/mar"
          cp "gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "./zod/grubbery/mar/ship.hoon"
          echo "$DESK_DISTER" > ./zod/grubbery/desk.ship
          ./automation/desk-commit.sh grubbery ./zod "$CONN_SOCK"

      - name: Populate %jars desk
        run: |
          # self-contained; its sys.kelvin already lists [%zuse 408].
          ./automation/desk-create.sh jars "$CONN_SOCK"
          ./automation/desk-mount.sh jars ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh jars ./zod
          cp -rL jars/desk/* ./zod/jars/
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "./zod/jars/mar"
          cp "gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "./zod/jars/mar/ship.hoon"
          echo "$DESK_DISTER" > ./zod/jars/desk.ship
          ./automation/desk-commit.sh jars ./zod "$CONN_SOCK"

      - name: Populate %trunk desk
        run: |
          # gwbtc/trunk's repo root is the desk, but it is not self-contained:
          # it borrows default-agent, skeleton and ten marks from %base and
          # the docket files from %landscape.  This copies the same set as
          # its scripts/fleet-deploy.sh, and keeps the sys.kelvin
          # desk-populate.sh wrote, as that script takes the ship's own.
          ./automation/desk-create.sh trunk "$CONN_SOCK"
          ./automation/desk-mount.sh trunk ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh trunk ./zod
          cp -rL gwbtc-trunk/{app,lib,mar,sur,gen,desk.bill,desk.docket-0} ./zod/trunk/
          cp gwbtc-urbit/pkg/base-dev/lib/{default-agent,skeleton}.hoon ./zod/trunk/lib/
          for m in bill css hoon html js kelvin mime noun svg txt ship; do
            cp "gwbtc-urbit/pkg/base-dev/mar/$m.hoon" ./zod/trunk/mar/
          done
          cp gwbtc-landscape/desk/mar/docket-0.hoon ./zod/trunk/mar/
          cp gwbtc-landscape/desk/lib/docket.hoon ./zod/trunk/lib/
          cp gwbtc-landscape/desk/sur/docket.hoon ./zod/trunk/sur/
          echo "$DESK_DISTER" > ./zod/trunk/desk.ship
          ./automation/desk-commit.sh trunk ./zod "$CONN_SOCK"

      - name: Populate %landscape desk
        run: |
          ./automation/desk-create.sh landscape "$CONN_SOCK"
          ./automation/desk-mount.sh landscape ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh landscape ./zod
          cp -r gwbtc-landscape/desk/* ./zod/landscape/
          cp -r gwbtc-landscape/desk-dev/* ./zod/landscape/
          cp -r gwbtc-urbit/pkg/base-dev/* ./zod/landscape/
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "./zod/landscape/mar"
          cp "gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "./zod/landscape/mar/ship.hoon"
          echo "$DESK_DISTER" > ./zod/landscape/desk.ship
          ./automation/desk-commit.sh landscape ./zod "$CONN_SOCK"

      - name: Populate %groups desk
        run: |
          # tlon-apps assembles %groups from peru-vendored deps plus desk/,
          # with its own scripts/assemble-desk.sh.  Assemble into a staging
          # directory, since that script rsyncs with --delete.
          pipx install peru
          export PATH="$HOME/.local/bin:$PATH"
          STAGE="${RUNNER_TEMP}/groups-desk"
          ./tlon-apps/scripts/assemble-desk.sh "$STAGE"
          ./automation/desk-create.sh groups "$CONN_SOCK"
          ./automation/desk-mount.sh groups ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh groups ./zod
          cp -rL "$STAGE"/* ./zod/groups/
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "./zod/groups/mar"
          cp "gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "./zod/groups/mar/ship.hoon"
          echo "$DESK_DISTER" > ./zod/groups/desk.ship
          ./automation/desk-commit.sh groups ./zod "$CONN_SOCK"

      - name: Populate %webterm desk
        run: |
          # %webterm is a docket glob for %base's %herm agent; its desk.bill
          # is ~.  Upstream's desk/ symlinks lib/, mar/ and sur/ into a
          # base-dev/ beside it, so this lays down our base-dev and the
          # landscape docket files and copies only the desk's own top-level
          # files.  Its sys.kelvin names [%zuse 413] and up, so keep the
          # [%zuse 408] desk-populate.sh wrote, or it installs suspended.
          ./automation/desk-create.sh webterm "$CONN_SOCK"
          ./automation/desk-mount.sh webterm ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh webterm ./zod
          cp -r gwbtc-urbit/pkg/base-dev/* ./zod/webterm/
          cp -r gwbtc-landscape/desk-dev/* ./zod/webterm/
          cp urbit-webterm/desk/desk.bill urbit-webterm/desk/desk.docket-0 ./zod/webterm/
          echo "$DESK_DISTER" > ./zod/webterm/desk.ship
          ./automation/desk-commit.sh webterm ./zod "$CONN_SOCK"

      - name: Set up Bun (for %drive frontend)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Populate %drive desk
        run: |
          # %drive is a Landscape docket app: build its client bundle into
          # desk/app/drive/, then commit like any desk.  Its sys.kelvin is
          # [%zuse 410]; widen it to also accept 408 (this pill's kelvin),
          # or it installs suspended.
          # drive's frontend (package.json + build) lives in client/, per its
          # Makefile (`cd client && bun install && bun run build`); the build
          # writes the JS/CSS bundle into desk/app/drive/.
          pushd gwbtc-drive/client
          bun install --frozen-lockfile || bun install
          bun run build
          popd
          ./automation/desk-create.sh drive "$CONN_SOCK"
          ./automation/desk-mount.sh drive ./zod "$CONN_SOCK"
          ./automation/desk-populate.sh drive ./zod
          cp -rL gwbtc-drive/desk/* ./zod/drive/
          printf '[%%zuse 410]\n[%%zuse 409]\n[%%zuse 408]\n' > ./zod/drive/sys.kelvin
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "./zod/drive/mar"
          cp "gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "./zod/drive/mar/ship.hoon"
          echo "$DESK_DISTER" > ./zod/drive/desk.ship
          ./automation/desk-commit.sh drive ./zod "$CONN_SOCK"
      - name: Populate %chorus desk
        run: |
          ROOT="${GITHUB_WORKSPACE:-$PWD}"
          # gwbtc/chorus has no checked-in vendored deps; its build.zig
          # fetches the pinned imports and lays the desk out under zig-out/.
          pushd "${ROOT}/gwbtc-chorus"
          zig build
          test -f zig-out/desk.bill
          grep -q '%zuse 408' zig-out/sys.kelvin
          popd
          "${ROOT}/automation/desk-create.sh" chorus "$CONN_SOCK"
          "${ROOT}/automation/desk-mount.sh" chorus "${ROOT}/zod" "$CONN_SOCK"
          "${ROOT}/automation/desk-populate.sh" chorus "${ROOT}/zod"
          cp -rL "${ROOT}/gwbtc-chorus/zig-out/"* "${ROOT}/zod/chorus/"
          # desk.ship needs a %ship mark, or clay drops the commit silently.
          mkdir -p "${ROOT}/zod/chorus/mar"
          cp "${ROOT}/gwbtc-urbit/pkg/base-dev/mar/ship.hoon" "${ROOT}/zod/chorus/mar/ship.hoon"
          echo "$DESK_DISTER" > "${ROOT}/zod/chorus/desk.ship"
          "${ROOT}/automation/desk-commit.sh" chorus "${ROOT}/zod" "$CONN_SOCK"

      - name: Wait for Clay to settle
        run: ./automation/wait-idle.sh "$CONN_SOCK"

      - name: Build brass pill
        run: |
          source ./automation/fyrd.sh
          read -r -d '' BUILD_PILL_FYRD << 'HOON' || true
          :*  0
              %fyrd  %base  %khan-eval  %noun  %ted-eval
              :_  :~  /sur/spider/hoon  /lib/strandio/hoon  /lib/pill/hoon  ==
              '''
              =/  m  (strand ,vase)
              ^-  form:m
              ;<  our=@p   bind:m  get-our
              ;<  now=@da  bind:m  get-time
              =/  sys=path    /(scot %p our)/gw-base/(scot %da now)/sys
              =/  dez=(list [desk path])
                :~  [%GWDESK /(scot %p our)/GWDESK/(scot %da now)]
                    [%node /(scot %p our)/node/(scot %da now)]
                    [%mcp /(scot %p our)/mcp/(scot %da now)]
                    [%vitriol /(scot %p our)/vitriol/(scot %da now)]
                    [%trill /(scot %p our)/trill/(scot %da now)]
                    [%grubbery /(scot %p our)/grubbery/(scot %da now)]
                    [%jars /(scot %p our)/jars/(scot %da now)]
                    [%trunk /(scot %p our)/trunk/(scot %da now)]
                    [%groups /(scot %p our)/groups/(scot %da now)]
                    [%webterm /(scot %p our)/webterm/(scot %da now)]
                    [%landscape /(scot %p our)/landscape/(scot %da now)]
                    [%drive /(scot %p our)/drive/(scot %da now)]
                    [%dns /(scot %p our)/dns/(scot %da now)]
                    [%chorus /(scot %p our)/chorus/(scot %da now)]
                ==
              =/  =pill:pill  (brass:pill sys dez & & | ~)
              ;<  ~  bind:m
                %:  send-raw-card
                    %pass  /build
                    %arvo  %c
                    %info  %base  %&
                    :~  [/pill/pill %ins %pill !>(pill)]
                    ==
                ==
              (pure:m !>('Built pill!'))
              '''
          ==
          HOON
          # The desk list above is the desks baked INTO the pill, and it must
          # name the desk we actually installed.  GWDESK is substituted rather
          # than interpolated so the heredoc stays quoted -- Hoon and shell
          # fight over too many characters otherwise.
          BUILD_PILL_FYRD="${BUILD_PILL_FYRD//GWDESK/$GW_DESK}"
          echo "pill will bake desks: $GW_DESK node mcp vitriol trill grubbery jars trunk groups webterm landscape drive dns chorus"

          RESULT=$(send_fyrd "$BUILD_PILL_FYRD")
          echo "$RESULT"

          # REQUIRE the success we want; do not merely look for one known
          # failure.  This used to grep for "brass: cache entries: 0" and
          # treat everything else as success -- so when the thread came back
          # `[0 %avow 1 %thread-fail %cancelled 0]` (a desk path in the list
          # above naming a desk that did not exist), the step printed "Pill
          # build completed" and exited 0.  The next step then waited 45
          # MINUTES for a pill that was never going to be written, and the
          # run's only visible error was "Pill never appeared", which names
          # the symptom and hides the cause.
          #
          # A success is `%avow 0` carrying 'Built pill!'.  Anything else,
          # including any future failure nobody has seen yet, stops here.
          if ! echo "$RESULT" | grep -Fq "'Built pill!'"; then
            echo "::error::the pill-build thread did not report success"
            echo "expected: [0 %avow 0 %noun 'Built pill!']"
            echo "got:      $RESULT"
            exit 1
          fi
          echo "Pill build completed."

      - name: Wait for pill to appear
        timeout-minutes: 45
        run: |
          for i in $(seq 1 900); do
            PILL_FILE=$(find ./zod/base/ -name "*.pill" -type f 2>/dev/null | head -1)
            if [ -n "$PILL_FILE" ]; then
              echo "Found pill at: $PILL_FILE"
              cp "$PILL_FILE" ./gw-base.pill
              ls -la ./gw-base.pill
              exit 0
            fi
            [ $((i % 60)) -eq 0 ] && echo "--- $i iterations, no pill yet ---"
            sleep 3
          done
          echo "ERROR: Pill never appeared."
          exit 1

      - name: Shutdown ~zod
        if: always()
        run: |
          kill "$(cat ./zod/.urb/pid 2>/dev/null)" 2>/dev/null || true
          sleep 3
          pkill -f "urbit" || true

      - name: Upload pill
        uses: actions/upload-artifact@v4
        with:
          name: gw-base-pill
          path: ./gw-base.pill

  # =============================================================
  # Build vere for each platform
  # =============================================================
  build-vere:
    name: "Build vere: ${{ matrix.target }}"
    strategy:
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            zig_target: x86_64-linux-musl
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-musl
          - target: macos-aarch64
            runner: macos-14
            zig_target: aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
          cache-key: vere-${{ matrix.zig_target }}

      - name: Checkout gwbtc/urcrypt
        uses: actions/checkout@v4
        with:
          repository: gwbtc/urcrypt
          ref: ${{ env.URCRYPT_BRANCH }}
          path: gwbtc-urcrypt
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Prepare urcrypt
        run: |
          rm -f gwbtc-urcrypt/build.zig gwbtc-urcrypt/build.zig.zon
          ln -sf $(pwd)/gwbtc-urcrypt $(pwd)/urcrypt

      - name: Checkout gwbtc/vere
        uses: actions/checkout@v4
        with:
          repository: gwbtc/vere
          ref: ${{ inputs.vere_ref || env.VERE_BRANCH }}
          path: gwbtc-vere
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Build vere
        run: |
          cd gwbtc-vere
          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3..."
            if zig build -Doptimize=ReleaseFast -Dunsafe-dawn=true -Dtarget=${{ matrix.zig_target }}; then
              break
            elif [ $attempt -eq 3 ]; then
              # Last resort: try vendoring zlib if GitHub is rate-limiting
              HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" \
                "https://github.com/allyourcodebase/zlib/archive/61e7df7e996ec5a5f13a653db3c419adb340d6ef.tar.gz")
              if [ "$HTTP_CODE" != "200" ]; then
                mkdir -p ext/zlib-src
                curl -L -o /tmp/zlib.tar.gz \
                  "https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz"
                tar xzf /tmp/zlib.tar.gz --strip-components=1 -C ext/zlib-src
                python3 -c "
          import re
          with open('build.zig.zon') as f: c = f.read()
          c = re.sub(r'(\.zlib\s*=\s*\.\{)\s*\.url\s*=\s*\"[^\"]+\",\s*\.hash\s*=\s*\"[^\"]+\",',
                     r'\1\n            .path = \"./ext/zlib-src\",', c)
          with open('build.zig.zon','w') as f: f.write(c)
          "
                zig build -Doptimize=ReleaseFast -Dunsafe-dawn=true -Dtarget=${{ matrix.zig_target }} || exit 1
              else
                exit 1
              fi
            else
              sleep 15
            fi
          done
          VERE_BIN=$(find zig-out -type f -executable 2>/dev/null | head -1)
          [ -z "$VERE_BIN" ] && VERE_BIN=$(find zig-out -type f \( -name "urbit" -o -name "vere" \) 2>/dev/null | head -1)
          cp "$VERE_BIN" ../gw-vere
          cd ..
          chmod +x ./gw-vere
          ./gw-vere --version || true

      - name: Upload vere
        uses: actions/upload-artifact@v4
        with:
          name: gw-vere-${{ matrix.target }}
          path: ./gw-vere

  # =============================================================
  # Build comet-miner + gw-onboard for each platform
  # =============================================================
  build-extras:
    name: "Build extras: ${{ matrix.target }}"
    strategy:
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            zig_target: x86_64-linux-musl
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-musl
          - target: macos-aarch64
            runner: macos-14
            zig_target: aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Zig 0.14.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
          cache-key: comet-miner-${{ matrix.zig_target }}

      - name: Checkout gwbtc/urcrypt
        uses: actions/checkout@v4
        with:
          repository: gwbtc/urcrypt
          ref: ${{ env.URCRYPT_BRANCH }}
          path: gwbtc-urcrypt
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Prepare urcrypt
        run: |
          rm -f gwbtc-urcrypt/build.zig gwbtc-urcrypt/build.zig.zon
          ln -sf $(pwd)/gwbtc-urcrypt $(pwd)/urcrypt

      - name: Checkout gwbtc/comet-miner
        uses: actions/checkout@v4
        with:
          repository: gwbtc/comet-miner
          ref: ${{ env.COMET_MINER_BRANCH }}
          path: gwbtc-comet-miner
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Build comet-miner
        run: |
          cd gwbtc-comet-miner
          sed -i.bak 's/printf("tries: %llu\\n"/printf("tries: %" PRIu64 "\\n"/g' pkg/vere/comet_miner.c
          if ! grep -q '#include <inttypes.h>' pkg/vere/comet_miner.c; then
            sed -i.bak '1s/^/#include <inttypes.h>\n/' pkg/vere/comet_miner.c
          fi
          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3..."
            zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseFast -Dprogram=comet_miner && break
            [ $attempt -eq 3 ] && exit 1
            sleep 15
          done
          MINER_BIN=$(find zig-out -type f -name "comet_miner" 2>/dev/null | head -1)
          [ -z "$MINER_BIN" ] && MINER_BIN=$(find zig-out -type f -executable 2>/dev/null | head -1)
          cp "$MINER_BIN" ../comet_miner
          cd ..
          chmod +x ./comet_miner

      - name: Upload comet-miner
        uses: actions/upload-artifact@v4
        with:
          name: comet-miner-${{ matrix.target }}
          path: ./comet_miner

      - name: Checkout gwbtc/groundwire (for onboarding script)
        uses: actions/checkout@v4
        with:
          repository: gwbtc/groundwire
          ref: ${{ inputs.groundwire_ref || env.GROUNDWIRE_BRANCH }}
          path: gwbtc-groundwire-onboard
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Set up Python for PyInstaller
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build gw-onboard
        run: |
          BOOTING_DIR=gwbtc-groundwire-onboard/onboarding/booting
          if [[ "$OSTYPE" == darwin* ]]; then
            sed -i '' 's|VERE_BIN = .*|VERE_BIN = "./gw-vere"|' "$BOOTING_DIR/gw-onboard.py"
            sed -i '' 's|COMET_MINER_BIN = .*|COMET_MINER_BIN = "./comet_miner"|' "$BOOTING_DIR/gw-onboard.py"
          else
            sed -i 's|VERE_BIN = .*|VERE_BIN = "./gw-vere"|' "$BOOTING_DIR/gw-onboard.py"
            sed -i 's|COMET_MINER_BIN = .*|COMET_MINER_BIN = "./comet_miner"|' "$BOOTING_DIR/gw-onboard.py"
          fi
          pip install pyinstaller requests embit PyNaCl cffi mmh3 bitstring bitarray
          pyinstaller --onefile --name gw-onboard \
            --hidden-import _cffi_backend \
            --collect-all cffi \
            --hidden-import nacl.bindings \
            --hidden-import nacl._sodium \
            --hidden-import embit.util.secp256k1 \
            --hidden-import bitstring.bitstore_bitarray \
            --hidden-import bitstring.bitstore_bitarray_helpers \
            --hidden-import bitstring.bitstore_common_helpers \
            --hidden-import bitstring.bitstore_tibs \
            --hidden-import bitstring.bitstore_tibs_helpers \
            --hidden-import bitarray \
            --hidden-import bitarray._bitarray \
            --hidden-import bitarray._util \
            --hidden-import mmh3 \
            "$BOOTING_DIR/gw-onboard.py"
          chmod +x dist/gw-onboard

      - name: Upload gw-onboard
        uses: actions/upload-artifact@v4
        with:
          name: gw-onboard-${{ matrix.target }}
          path: dist/gw-onboard

  # =============================================================
  # Validate the pill boots, then publish release
  # =============================================================
  validate-and-release:
    name: Validate and release
    needs: [build-pill, build-vere, build-extras]
    runs-on: ubuntu-22.04
    steps:
      # the workflow's helper scripts (automation/) live in gwbtc/urbit, which
      # used to be the repo this ran in; check it out at the kernel pin
      - name: Checkout gwbtc/urbit (automation scripts)
        uses: actions/checkout@v4
        with:
          repository: gwbtc/urbit
          ref: ${{ inputs.urbit_ref || env.URBIT_BRANCH }}

      # Causeway is Python source, not a per-platform binary, so it is copied
      # in here rather than built in the matrix.  Same ref as the desk in the
      # pill: a release whose Causeway and whose %gw-btc disagree about the
      # wire format is worse than one that ships neither.
      - name: Checkout gwbtc/groundwire (for Causeway + boot.sh)
        uses: actions/checkout@v4
        with:
          repository: gwbtc/groundwire
          ref: ${{ inputs.groundwire_ref || env.GROUNDWIRE_BRANCH }}
          path: gwbtc-groundwire
          token: ${{ secrets.GH_PAT_RELEASE || github.token }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y netcat-openbsd

      - name: Prepare binaries
        run: |
          cp ./artifacts/gw-vere-linux-x86_64/gw-vere ./gw-vere
          chmod +x ./gw-vere
          cp ./artifacts/gw-base-pill/gw-base.pill ./gw-base.pill
          cp ./artifacts/comet-miner-linux-x86_64/comet_miner ./comet_miner
          chmod +x ./comet_miner

      - name: "Validate: fake ~zod boot"
        env:
          VERE_BIN: ./gw-vere
          CONN_SOCK: ./zod2/.urb/conn.sock
        run: |
          ./gw-vere -d -F zod -B ./gw-base.pill -c zod2
          ./automation/wait-idle.sh "$CONN_SOCK" "$VERE_BIN"
          echo "Fake ~zod boot successful."
          kill "$(cat ./zod2/.urb/pid 2>/dev/null)" 2>/dev/null || true
          sleep 3

      - name: "Validate: comet boot"
        run: |
          MINER_OUT=$(./comet_miner --suite-c --tweak "'fake'" daplyd 2>&1)
          COMET=$(echo "$MINER_OUT" | grep '^comet:' | sed 's/^comet: ~//')
          FEED=$(echo "$MINER_OUT" | grep '^feed:' | awk '{print $2}')
          echo "Mined comet: $COMET"
          ./gw-vere -d -B ./gw-base.pill -c mycomet -w "$COMET" -G "$FEED" --gateway "$GW_GATEWAY"
          ./automation/wait-idle.sh ./mycomet/.urb/conn.sock ./gw-vere
          echo "Comet boot successful."
          kill "$(cat ./mycomet/.urb/pid 2>/dev/null)" 2>/dev/null || true
          sleep 3

      - name: "Validate: comet boot with wallet"
        run: |
          # Mine a comet identity for the wallet test
          COMET=$(./comet_miner 2>/dev/null | grep -oP '~[a-z-]+' | head -1)
          if [ -z "$COMET" ]; then
            echo "WARNING: comet_miner did not produce a comet, skipping wallet test"
            exit 0
          fi
          echo "Mined comet: $COMET"
          # Generate a dummy feed key for testing
          FEED=$(openssl rand -hex 32)
          ./gw-vere -d -B ./gw-base.pill -w "$COMET" -G "$FEED" -c mycomet-wallet --gateway "$GW_GATEWAY"
          ./automation/wait-idle.sh ./mycomet-wallet/.urb/conn.sock ./gw-vere
          echo "Comet boot with wallet successful."
          kill "$(cat ./mycomet-wallet/.urb/pid 2>/dev/null)" 2>/dev/null || true
          sleep 3

      - name: Shutdown all test ships
        if: always()
        run: |
          for pier in zod2 mycomet mycomet-wallet; do
            kill "$(cat ./$pier/.urb/pid 2>/dev/null)" 2>/dev/null || true
          done
          sleep 3
          pkill -f "gw-vere" || true

      - name: Install GitHub CLI
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -y && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh
          fi

      - name: Package release artifacts
        run: |
          printf 'embit\nPyNaCl\nrequests\n' > requirements.txt
          for target in linux-x86_64 linux-aarch64 macos-aarch64; do
            mkdir -p "pkg-${target}"
            cp ./gw-base.pill "pkg-${target}/"
            cp "./artifacts/gw-vere-${target}/gw-vere" "pkg-${target}/gw-vere"
            cp "./artifacts/comet-miner-${target}/comet_miner" "pkg-${target}/comet_miner"
            chmod +x "pkg-${target}/gw-vere" "pkg-${target}/comet_miner"
            cp "./artifacts/gw-onboard-${target}/gw-onboard" "pkg-${target}/gw-onboard"
            chmod +x "pkg-${target}/gw-onboard"
            # The installer's shared helpers and its per-ship supervisor.
            # These were 463 of causeway/public/boot.sh's 1,521 lines, carried
            # as heredocs and written to disk at install time -- not because
            # anyone wanted them there, but because a curl-piped script has no
            # file to re-exec.  A reader had to audit a third of the installer
            # before they could believe the rest of it, on a script that runs
            # as them and installs a daemon mediating all their Bitcoin
            # traffic.  Shipping the same bytes here puts them under the
            # release SHA256SUMS and leaves boot.sh's own audit surface at
            # "does this fetch and exec the right thing".
            # boot.sh REQUIRES both; a tarball missing them is one it refuses.
            cp ./automation/installer/gwlib.sh "pkg-${target}/gwlib.sh"
            cp ./automation/installer/gwsup.sh "pkg-${target}/gwsup.sh"
            chmod +x "pkg-${target}/gwlib.sh" "pkg-${target}/gwsup.sh"
            cp requirements.txt "pkg-${target}/"

            # Causeway: the tool that actually mints a confidential comet.
            # Until now no release contained it, so the only way to get one
            # was to clone the repo -- which meant the protocol we ship in the
            # pill had no shipped way to create an identity for it.
            # `causeway` is a launcher that builds a private venv from
            # causeway-src/ on first run; nothing lands outside this tree.
            cp -r gwbtc-groundwire/causeway/desktop "pkg-${target}/causeway-src"
            rm -rf "pkg-${target}/causeway-src/__pycache__" \
                   "pkg-${target}/causeway-src/causeway.egg-info" \
                   "pkg-${target}/causeway-src/tests"
            cp gwbtc-groundwire/causeway/public/causeway "pkg-${target}/causeway"
            # boot.sh ships here too, so a release can boot itself without
            # depending on the website being up to date.
            cp gwbtc-groundwire/causeway/public/boot.sh "pkg-${target}/boot.sh"
            chmod +x "pkg-${target}/causeway" "pkg-${target}/boot.sh"

            tar czf "groundwire-${target}.tar.gz" -C "pkg-${target}" .
            # Do not take a cp on trust.  A tarball missing gwlib.sh is one
            # that every boot.sh refuses, and the first anyone would hear of
            # it is a failed install; this is the same lesson as the desk
            # commits above, applied to the thing users actually download.
            for want in gw-vere gw-base.pill comet_miner gw-onboard \
                        gwlib.sh gwsup.sh requirements.txt \
                        causeway boot.sh causeway-src/causeway.py \
                        causeway-src/causeway_tui.py causeway-src/pyproject.toml; do
              tar tzf "groundwire-${target}.tar.gz" | grep -qx "./${want}" || {
                echo "ERROR: groundwire-${target}.tar.gz does not contain ${want}"
                exit 1
              }
            done
            echo "groundwire-${target}.tar.gz:"
            tar tzf "groundwire-${target}.tar.gz" | sort
          done

      # Until now nothing in a release carried a checksum: not the pill, not
      # gw-vere, not comet_miner, not gw-onboard, not the tarballs.  The only
      # thing authenticating a download was GitHub's TLS -- and the thing
      # people actually run is `curl -fsSL .../boot.sh | bash`, ~1,000 lines
      # executing as them and installing a daemon that mediates all their
      # Bitcoin traffic.  There was nothing to check it against.
      #
      # Be honest about what this buys.  SHA256SUMS comes down the same
      # channel as the tarball, so it is no defence at all against a
      # compromised GitHub.  What it gives you is a check against a corrupted
      # or truncated download, one stable digest to pin or to pass around out
      # of band, and something a third party can mirror and compare.  Signing
      # it is the next thing to do and is NOT done here.
      #
      # The client half already exists: boot.sh fetches SHA256SUMS, matches
      # the line for its own platform, and deletes the download on a
      # mismatch.  Publishing the file is the whole of the remaining work.
      - name: Checksum the release artifacts
        run: |
          sha256sum \
            groundwire-linux-x86_64.tar.gz \
            groundwire-linux-aarch64.tar.gz \
            groundwire-macos-aarch64.tar.gz \
            > SHA256SUMS
          cat SHA256SUMS
          # Read it back the way a user would, so a malformed file fails the
          # build here rather than every install.
          sha256sum -c SHA256SUMS

      - name: Publish release
        # A dispatch with publish=false is a test build: it stops here, with
        # everything the release would have carried left as run artifacts
        # and nothing published.  Push and schedule runs publish as before.
        if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.publish == false) }}
        run: |
          PREFIX="${TAG_PREFIX:-groundwire-alpha}"
          DATE_BASE=$(date -u +"%Y.%-m.%-d")
          TAG="${PREFIX}-${DATE_BASE}"
          TITLE="${PREFIX} ${DATE_BASE}"
          SUFFIX=2
          while gh release view "$TAG" --repo gwbtc/release &>/dev/null; do
            TAG="${PREFIX}-${DATE_BASE}_${SUFFIX}"
            TITLE="${PREFIX} ${DATE_BASE}_${SUFFIX}"
            SUFFIX=$((SUFFIX + 1))
          done

          # --latest=false, ALWAYS, and it is load-bearing.
          #
          # Every release this org publishes is a --prerelease, and when there
          # is no full release GitHub serves the newest prerelease at
          # /releases/latest.  Verified: that URL resolves to the newest
          # groundwire-daily tag.  boot.sh and install.sh both resolve "latest"
          # through it when no --version is given.
          #
          # So without this flag, a developer build from this lane -- or a
          # release candidate cut from an unmerged branch -- silently becomes
          # what every new user installs by default.  This lane is the
          # bleeding-edge channel; daily-release.yml owns the user channel.
          gh release create "$TAG" \
            groundwire-linux-x86_64.tar.gz \
            groundwire-linux-aarch64.tar.gz \
            groundwire-macos-aarch64.tar.gz \
            SHA256SUMS \
            --repo gwbtc/release \
            --prerelease \
            --latest=false \
            --title "$TITLE" \
            --notes "Built from the pins at gwbtc/release@${GITHUB_SHA} (\`${GITHUB_REF_NAME}\`)

          Release channel: \`bleeding-edge\`
          Tag format: \`groundwire-alpha-*\`
          Daily onboarding channel tags: \`groundwire-daily-*\`

          Each tarball contains everything needed to onboard:
          - \`gw-vere\` — Urbit runtime
          - \`gw-base.pill\` — Brass pill
          - \`comet_miner\` — Comet miner
          - \`gw-onboard\` — Onboarding script
          - \`gwlib.sh\`, \`gwsup.sh\` — the installer's shared helpers and its per-ship supervisor, installed and run by \`causeway/public/boot.sh\`
          - \`requirements.txt\` — Python dependencies (\`pip install -r requirements.txt\`)

          ## Verifying the download

              curl -fsSLO https://github.com/gwbtc/release/releases/download/${TAG}/SHA256SUMS
              sha256sum -c SHA256SUMS

          The digest covers the tarball, and so everything inside it. boot.sh
          does this for you, and \`--sha256 <hex>\` pins a digest you got
          somewhere else.

          \`SHA256SUMS\` is NOT signed and is served from the same host as the
          tarballs, so it is a check against a bad download and a stable thing
          to pin — not a defence against a compromised GitHub.

          Usage: \`tar xzf groundwire-<platform>.tar.gz && ./gw-onboard\`
          - \`groundwire-linux-x86_64.tar.gz\`
          - \`groundwire-linux-aarch64.tar.gz\`
          - \`groundwire-macos-aarch64.tar.gz\`"
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env:, not interpolated into the script body -- a dispatch
          # input pasted straight into `run:` is a shell-injection seam even
          # when only collaborators can pull the trigger.
          TAG_PREFIX: ${{ inputs.tag_prefix }}
